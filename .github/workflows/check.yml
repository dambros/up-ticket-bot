name: check
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: check
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python check.py
        env:
          MAX_TOTAL: ${{ vars.MAX_TOTAL }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add last_total.txt
          git diff --cached --quiet || (git commit -m "totals $(tr "\n" " " < last_total.txt)" && git push)
